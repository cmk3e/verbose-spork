<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tote Handicapper</title>
<style>
  :root {
    --bg: #f5f3ee; --panel: #ffffff; --ink: #1d1f22; --muted: #6b6f76; --line: #e2ded5;
    --accent: #1f6f50; --warn: #b26a00; --hot: #b3261e; --chip: #efece4;
    --up: #b3261e; --down: #1f6f50;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121416; --panel: #1b1e21; --ink: #e8e6e1; --muted: #9aa0a6; --line: #2c3035;
      --accent: #4fbf8f; --warn: #e0a040; --hot: #ff6b5e; --chip: #24282c;
      --up: #ff6b5e; --down: #4fbf8f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px;
           padding: 18px 16px 10px; max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .2px; }
  .sub { color: var(--muted); font-size: 13px; }
  main { max-width: 1100px; margin: 0 auto; padding: 0 16px 40px; display: grid; gap: 14px; }
  .race { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .race > .top { display: flex; align-items: center; gap: 12px; padding: 12px 14px; flex-wrap: wrap; }
  .race h2 { font-size: 16px; margin: 0; }
  .mtp { font: 600 22px var(--mono); margin-left: auto; font-variant-numeric: tabular-nums; }
  .mtp.soon { color: var(--warn); } .mtp.now { color: var(--hot); }
  .pill { font-size: 12px; padding: 2px 9px; border-radius: 99px; background: var(--chip); color: var(--muted); }
  .pill.tracking { color: var(--warn); } .pill.ticketed { color: var(--accent); }
  .pill.skipped, .pill.missed, .pill.error { color: var(--hot); }
  .msg { color: var(--muted); font-size: 13px; padding: 0 14px 10px; }
  .body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); border-top: 1px solid var(--line); }
  @media (max-width: 760px) { .body { grid-template-columns: 1fr; } }
  .col { padding: 12px 14px; min-width: 0; }
  .col + .col { border-left: 1px solid var(--line); }
  @media (max-width: 760px) { .col + .col { border-left: 0; border-top: 1px solid var(--line); } }
  h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin: 0 0 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; }
  td.num, th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  td.name { overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
  .up { color: var(--up); } .down { color: var(--down); }
  .grp { display: inline-block; min-width: 18px; text-align: center; border-radius: 4px; font-size: 11px; font-weight: 700; }
  .grp.A { background: var(--accent); color: var(--panel); } .grp.B { background: var(--chip); }
  pre { margin: 0; font: 12.5px/1.5 var(--mono); white-space: pre; overflow-x: auto; }
  .tickets { display: grid; gap: 10px; }
  .actions { margin-top: 8px; display: flex; gap: 8px; }
  button, a.btn { font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line);
                  background: var(--chip); color: var(--ink); cursor: pointer; text-decoration: none; }
  .empty { color: var(--muted); font-size: 13px; }
  .spark { vertical-align: middle; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Tote Handicapper</h1>
    <div class="sub" id="rule">Pulls the tote at T-3:00, tickets at T-2:00</div>
  </div>
  <div class="sub" id="clock">connecting…</div>
</header>
<main id="races"><div class="empty">Waiting for the race list…</div></main>

<script>
let state = null, offsetMs = 0;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const LADDER = [[1,9],[1,5],[2,5],[1,2],[3,5],[4,5],[1,1],[6,5],[7,5],[3,2],[8,5],[9,5],[2,1],[5,2],[3,1],[7,2],[4,1],[9,2]];
function to1(d) {
  if (d == null) return "SCR";
  const x = d - 1;
  if (x >= 5) return `${Math.floor(x + 1e-9)}-1`;
  let best = LADDER[0];
  for (const [n, den] of LADDER) if (n / den <= x + 1e-9) best = [n, den];
  return `${best[0]}-${best[1]}`;
}
function fmtMtp(sec) {
  if (sec <= 0) return "POST";
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return `${m}:${String(s).padStart(2, "0")}`;
}
function spark(series) {
  const pts = series.filter(v => v != null);
  if (pts.length < 2) return "";
  const w = 60, h = 16, lo = Math.min(...pts), hi = Math.max(...pts), span = hi - lo || 1;
  const d = pts.map((v, i) => `${(i / (pts.length - 1) * w).toFixed(1)},${(h - (v - lo) / span * h).toFixed(1)}`).join(" ");
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h + 1}"><polyline fill="none" stroke="currentColor" stroke-width="1.3" points="${d}"/></svg>`;
}

function oddsTable(r) {
  const tote = r.latest_tote;
  if (!tote) return `<div class="empty">Tote pull starts at T-${Math.round(state.pull_at_sec / 60)}:00</div>`;
  const first = r.history[0]?.odds || {};
  const groups = r.result?.groups || {};
  const grp = p => groups.A?.includes(p) ? "A" : groups.B?.includes(p) ? "B" : groups.C?.includes(p) ? "C" : "";
  const model = Object.fromEntries((r.result?.runners || []).map(x => [x.program_num, x]));
  const rows = tote.runners.map(t => {
    const mv = first[t.program_num] && t.odds ? t.odds - first[t.program_num] : 0;
    const cls = mv < -0.15 ? "down" : mv > 0.15 ? "up" : "";
    const m = model[t.program_num];
    const g = grp(t.program_num);
    return `<tr>
      <td>${esc(t.program_num)}</td><td class="name" title="${esc(t.name)}">${esc(t.name)}</td>
      <td class="num ${cls}">${t.scratched ? "SCR" : to1(t.odds)}</td>
      <td class="${cls}">${spark(r.history.map(h => h.odds[t.program_num]))}</td>
      <td class="num">${m ? (m.p_true * 100).toFixed(1) + "%" : ""}</td>
      <td class="num">${m ? (m.ev >= 0 ? "+" : "") + (m.ev * 100).toFixed(0) + "%" : ""}</td>
      <td>${g ? `<span class="grp ${g}">${g}</span>` : ""}</td></tr>`;
  }).join("");
  const pulled = new Date(tote.fetched_at).toLocaleTimeString();
  return `<table><thead><tr><th>#</th><th>Horse</th><th class="num">Odds</th><th>Move</th>
    <th class="num">Model</th><th class="num">EV</th><th></th></tr></thead><tbody>${rows}</tbody></table>
    <div class="sub" style="margin-top:6px">Last pull ${pulled}${tote.win_pool ? ` · win pool $${Math.round(tote.win_pool).toLocaleString()}` : ""}
    · ${r.history.length} snapshot${r.history.length === 1 ? "" : "s"} · red = drifting, green = being bet</div>`;
}

function ticketsPane(r) {
  if (!r.ticket_text) {
    const when = r.status === "tracking" ? "Tickets at T-" + Math.round(state.ticket_at_sec / 60) + ":00" : "";
    return `<div class="empty">${esc(when || "No tickets")}</div>`;
  }
  const res = r.result;
  return `<div class="tickets"><pre>${esc(r.ticket_text)}</pre>
    <div class="sub">Pace: ${esc(res.pace.description)}</div>
    <div class="actions"><button data-copy="${esc(r.race.race_id)}">Copy tickets</button>
    <a class="btn" href="/api/tickets/${encodeURIComponent(r.race.race_id)}.txt" target="_blank">Open .txt</a></div></div>`;
}

function render() {
  if (!state) return;
  const now = Date.now() + offsetMs;
  $("#clock").textContent = new Date(now).toLocaleTimeString();
  $("#rule").textContent = `Pulls the tote at T-${fmtMtp(state.pull_at_sec)}, tickets at T-${fmtMtp(state.ticket_at_sec)}`;
  const main = $("#races");
  if (!state.races.length) { main.innerHTML = `<div class="empty">No races from the provider yet.</div>`; return; }
  main.innerHTML = state.races.map(r => {
    const sec = (new Date(r.race.post_time) - now) / 1000;
    const cls = sec <= state.ticket_at_sec ? "now" : sec <= state.pull_at_sec ? "soon" : "";
    const done = ["missed", "skipped"].includes(r.status) && !r.ticket_text;
    const post = new Date(r.race.post_time).toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
    return `<section class="race">
      <div class="top"><h2>${esc(r.race.track)} · Race ${esc(r.race.race_number)}</h2>
        <span class="pill ${esc(r.status)}">${esc(r.status)}</span>
        <span class="sub">post ${post}</span>
        <span class="mtp ${cls}">${done ? "" : fmtMtp(sec)}</span></div>
      ${r.message ? `<div class="msg">${esc(r.message)}</div>` : ""}
      ${r.latest_tote || r.ticket_text ? `<div class="body"><div class="col"><h3>Live tote</h3>${oddsTable(r)}</div>
        <div class="col"><h3>Tickets</h3>${ticketsPane(r)}</div></div>` : ""}
    </section>`;
  }).join("");
}

async function poll() {
  try {
    const t0 = Date.now();
    const res = await fetch("/api/state", {cache: "no-store"});
    state = await res.json();
    offsetMs = new Date(state.server_time) - (t0 + Date.now()) / 2;
  } catch (e) { $("#clock").textContent = "dashboard lost connection — retrying"; }
  render();
}

document.addEventListener("click", e => {
  const id = e.target.dataset?.copy;
  if (!id) return;
  const r = state.races.find(x => x.race.race_id === id);
  navigator.clipboard?.writeText(r.ticket_text).then(() => { e.target.textContent = "Copied"; });
});

poll(); setInterval(poll, 3000); setInterval(render, 1000);
</script>
</body>
</html>
